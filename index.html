<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SnapVector — rough loop in, clean SVG out</title>
    <meta
      name="description"
      content="Draw a rough loop around anything in an image and get a clean SVG cutout. Runs entirely in your browser — your image never leaves your device."
    />

    <!-- Runs before first paint so a stored override is applied without a flash of the
         wrong theme. Deliberately inline and synchronous: the module script below is
         deferred and would land after the page has already painted. -->
    <script>
      try {
        var storedTheme = localStorage.getItem('snapvector:theme');
        if (storedTheme === 'light' || storedTheme === 'dark') {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch (error) {
        /* Storage unavailable — fall through to the OS preference. */
      }
    </script>

    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/app.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body>
    <header class="site-header">
      <span class="brand">
        <svg class="brand__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12.4 3.3c4.6.2 8.5 3.3 8.3 7.9-.3 4.9-4.2 9.6-9.2 9.4-4.7-.2-8.2-4-8.1-8.8.1-4.6 4.4-8.7 9-8.5Z"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
          <rect x="10.5" y="1.5" width="3.6" height="3.6" rx="0.9" fill="currentColor" />
          <rect x="9.4" y="18.8" width="3.6" height="3.6" rx="0.9" fill="currentColor" />
        </svg>
        <span class="brand__name">SnapVector</span>
      </span>

      <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
        <svg class="theme-toggle__icon icon-moon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.2 8.2 0 1 0 10.2 10.2Z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linejoin="round"
          />
        </svg>
        <svg class="theme-toggle__icon icon-sun" viewBox="0 0 24 24" aria-hidden="true">
          <circle
            cx="12"
            cy="12"
            r="4.2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.7"
          />
          <path
            d="M12 2.6v2.2M12 19.2v2.2M21.4 12h-2.2M4.8 12H2.6M18.6 5.4 17 7M7 17l-1.6 1.6M18.6 18.6 17 17M7 7 5.4 5.4"
            stroke="currentColor"
            stroke-width="1.7"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </header>

    <main id="app" class="app"></main>
  </body>
</html>
